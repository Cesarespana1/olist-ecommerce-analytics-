version: 2

models:
- name: stg_customers
  description: |
    Staging table containing customer information from olist dataset
    A customer could have multiple customer_id as is generated
    for each order.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - customer_id
        - customer_unique_id
  columns:
  - name: customer_id
    description: >
      Identifier generated by olist system for each order
    data_tests:
    - not_null
  - name: customer_unique_id
    description: >
      Unique identifier for each customer across multiple orders in the olist dataset
    data_tests:
    - not_null
  - name: customer_zip_code_prefix
    description: >
      Zip code prefix of the customer address
    data_tests:
    - not_null
  - name: customer_city
    description: >
      City of the customer address
    data_tests:
    - not_null
  - name: customer_state
    description: >
      State of the customer address
    data_tests:
    - not_null
- name: stg_geolocation
  description: |
    Staging table containing olist ecommerce geoespacial information.
    One row per raw geolocation record.
    Note: 1,000,163 rows across 19,015 distinct zip prefixes.
    dim_geolocation collapses to one row per zip using avg() for coordinates and mode() for city/state.
  columns:
  - name: geo_zip_code_prefix
    description: >
      Zip code prefix of the geolocation information.
    data_tests:
    - not_null
  - name: geolocation_lat
    description: latitude
    data_tests:
    - not_null
  - name: geolocation_lng
    description: longitude
    data_tests:
    - not_null
  - name: geolocation_city
    description: city name
    data_tests:
    - not_null
  - name: geolocation_state
    description: state name
    data_tests:
    - not_null
- name: stg_order_items
  description: |
    Staging model containing order item information from olist dataset.
    One row per item within an order. An order with 3 items has 3 rows
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - order_item_id
        - order_id
  columns:
  - name: order_id
    description: >
      Identifier generated by olist system for each order.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_orders')
          field: order_id
  - name: order_item_id
    description: >
      Sequential number identifying number of items included in the same order.
    data_tests:
    - not_null
  - name: product_id
    description: >
      Product unique identifier
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_products')
          field: product_id
  - name: seller_id
    description: >
      Seller unique identifier
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_sellers')
          field: seller_id
  - name: shipping_limit_date
    description: >
      Shows the seller shipping limit date for handling the order over to the logistic partner.
    data_tests:
    - not_null
  - name: price
    description: >
      item price
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          inclusive: true
  - name: freight_value
    description: |
      freight value item (if an order has more than one item
      the freight value is splitted between items)
    data_tests:
    - not_null
- name: stg_order_payments
  description: >
    Includes data about the orders payment options. One row per payment type. An order split across card + voucher has two.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - order_id
        - payment_sequential
  columns:
  - name: order_id
    description: >
      Identifier of an order.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_orders')
          field: order_id
  - name: payment_sequential
    description: >
      A sequence is created if a customer paid with more than one payment method.
    data_tests:
    - not_null
  - name: payment_type
    description: >
      Payment type used for the order, can be one of the following, credit_card, boleto, voucher, debit_card and not_defined.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: [ 'credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined' ]
  - name: payment_value
    description: |
      Payment value for the order. Its min value is 0,
      as some orders are paid using vouchers or other payment methods
      that don't require a monetary value.
      Note: 9 payments of R$0.00 (6 voucher, 3 not_defined) are kept as valid
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          inclusive: true
  - name: payment_installments
    description: >
      Number of installments used to pay the order.
    data_tests:
    - not_null
- name: stg_order_reviews
  description: |
    Staging table containing review information from olist dataset.
    One row per (review, order) pair; review_id repeats across orders because one review can cover several.
    Real grain is (review_id, order_id); review_id alone repeats for 789 reviews covering 2-3 orders each, always the same customer. 
    Row counts and small-group averages must account for it; the effect on the global mean is negligible (4.0864 vs 4.0888).
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - review_id
        - order_id
  columns:
  - name: review_id
    description: >
      Identifier generated by olist system for each review.
    data_tests:
    - not_null
  - name: order_id
    description: >
      Identifier generated by olist system for each order.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_orders')
          field: order_id
  - name: review_creation_date
    description: >
      Date when the review was created.
    data_tests:
    - not_null
  - name: review_answer_timestamp
    description: >
      Date when the review was answered by olist team.
    data_tests:
    - not_null
  - name: review_score
    description: >
      Review score given by the customer for the order, note range goes from 1 to 5.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: [ 1, 2, 3, 4, 5 ]
  - name: review_comment_title
    description: >
      Review comment title given by the customer for the order.
  - name: review_comment_message
    description: >
      Review comment message given by the customer for the order.
- name: stg_orders
  description: >
    Staging table containing orders from olist dataset.
  columns:
  - name: order_id
    description: >
      Primary key, identifier generated by olist system for each order.
    data_tests:
    - unique
    - not_null
  - name: customer_id
    description: >
      Key to the customer dataset. Each order has a unique customer_id
    data_tests:
    - not_null
    - unique
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: order_purchase_timestamp
    description: >
      Shows the purchase timestamp.
    data_tests:
    - not_null
  - name: order_approved_at
    description: |
      Shows the payment approval timestamp.
      Note: 14 delivered orders have no approval timestamp
      for a total payment record of $1954,60. Approval did happen 
      and only the timestamp failed to write a source logging gap affecting 0.015% of 96,478 delivered orders. 
      Scope excludes created (payment never cleared; 2 of the 5 are boleto, which is issued at checkout 
      and frequently never paid) and canceled (straddles both lifecycles — 141 null, 484 with timestamps).
    data_tests:
    - not_null:
        config:
          where: "order_status not in ('created', 'canceled')"
          error_if: ">20"
  - name: order_delivered_carrier_date
    description: |
      Shows the order posting timestamp. When it was handled to the logistic partner.
      Note: Scoped to delivered + shipped, the statuses where handover to the carrier must have occurred.
      1,783 unscoped nulls drop to 2
    data_tests:
    - not_null:
        config:
          where: "order_status in ('delivered', 'shipped')"
          error_if: ">20"
  - name: order_delivered_customer_date
    description: |
      Shows the actual order delivery date to the customer.
      Note: scoped to delivered. 2,965 unscoped nulls drop to 8. Every other status is 100% null because delivery hasn't happened.
    data_tests:
    - not_null:
        config:
          where: "order_status = 'delivered'"
          error_if: ">10"
          warn_if: ">0"
  - name: order_estimated_delivery_date
    description: >
      Shows the estimated delivery date that was informed to customer at the purchase moment.
    data_tests:
    - not_null
  - name: order_status
    description: Reference to the order status. Can be one of the following, delivered, shipped, canceled, unavailable, invoiced, processing, created and approved.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: [ 'delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved' ]
- name: stg_product_category_name_translation
  description: |
    Staging table containing product category name translation from olist dataset.
  columns:
  - name: product_category_name
    description: |
      Category name in portuguese
      Note: 610 of 32,951 products (1.9%) have no category. 
      dim_products backfills via a three-argument coalesce, 
      so the equivalent marts test is a hollow green — staging
      is the only layer where this gap is visible.
    data_tests:
    - not_null
    - unique
  - name: product_category_name_english
    description: category name in english
    data_tests:
    - not_null:
        config:
          warn_if: ">0"
- name: stg_products
  description: |
    Staging table containing product information from olist dataset.
    Note: Same 610 products are null for category, name length, 
    description length and photo count together. 
    One incomplete product-registration record, not four independent gaps.
  columns:
  - name: product_id
    description: >
      Identifier generated by olist system for each product.
    data_tests:
    - unique
    - not_null
  - name: product_category_name
    description: product category name in portuguese
    data_tests:
    - not_null:
        config:
          error_if: ">630"
          warn_if: ">0"
  - name: product_name_length
    description: number of characters extracted from the product name.
    data_tests:
    - not_null:
        config:
          error_if: ">630"
          warn_if: ">0"
  - name: product_description_length
    description: number of characters extracted from the product description.
    data_tests:
    - not_null:
        config:
          error_if: ">630"
          warn_if: ">0"
  - name: product_photos_qty
    description: >
      Number of photos available for the product.
    data_tests:
    - not_null:
        config:
          severity: warn
  - name: product_weight_g
    description: |
      weight of the product in grams.
      Note: filtered out 0 values as they misrepresents unknown data.
      6 nulls = 2 genuinely null in the source + 4 that were 0 g, 
      converted by nullif(product_weight_g, 0) in staging. The 4 zeros are placeholder data, 
      not measurements: all bed_bath_table, identical 30x25 dimensions, and sold 8 times, so they're live rows.
    data_tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          inclusive: false
    - not_null:
        config:
          severity: warn
  - name: product_length_cm
    description: |
      length of the product in centimeters.
      Note: the same 2 products that lack a weight. 
      Verified: dimensions go missing as a set, never individually.
    data_tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          inclusive: false
    - not_null:
        config:
          severity: warn
  - name: product_height_cm
    description: |
      Height of the product in centimeters.
      Note: the same 2 products that lack a weight. 
      Verified: dimensions go missing as a set, never individually.
    data_tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          inclusive: false
    - not_null:
        config:
          severity: warn
  - name: product_width_cm
    description: |
      Width of the product in centimeters.
      Note: the same 2 products that lack a weight. 
      Verified: dimensions go missing as a set, never individually.
    data_tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          inclusive: false
    - not_null:
        config:
          severity: warn
- name: stg_sellers
  description: >
    Staging table containing seller information from olist dataset.
  columns:
  - name: seller_id
    description: >
      Identifier generated by olist system for each seller.
    data_tests:
    - unique
    - not_null
  - name: seller_zip_code_prefix
    description: >
      Zip code prefix of the seller address.
    data_tests:
    - not_null
  - name: seller_city
    description: >
      City of the seller address.
    data_tests:
    - not_null
  - name: seller_state
    description: >
      State of the seller address.
    data_tests:
    - not_null
