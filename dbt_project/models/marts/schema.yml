version: 2

models:
- name: dim_customers
  description: |
    dimension table containing customer information from olist dataset
  columns:
  - name: customer_key
    description: >
      Primary key, surrogate key using dbt_utils based on customer_id note: customer_id is generated by olist system for each order, a customer could have multiple key values. For unique customer analysis group by customer_unique_id instead.
    data_tests:
    - unique
    - not_null
  - name: customer_id
    description: >
      Identifier generated by olist system for each order
  - name: customer_unique_id
    description: >
      Unique identifier for each customer across multiple orders in the olist dataset
  - name: customer_zip_code_prefix
    description: >
      Zip code prefix of the customer address
  - name: customer_city
    description: >
      City of the customer address
  - name: customer_state
    description: >
      State of the customer address
- name: dim_date
  description: |
    dimension table containing date information from olist dataset
    it covers the range of dates from 2016-09-01 to 2020-04-11
  columns:
  - name: date_key
    description: >
      Primary key, shows the date in format YYYYMMDD
    data_tests:
    - unique
    - not_null
  - name: date_day
    description: >
      contains date format YYYY-MM-DD
    data_tests:
    - not_null
  - name: year
    description: >
      Year of the date
    data_tests:
    - not_null
  - name: month
    description: >
      Month of the date
    data_tests:
    - not_null
  - name: day
    description: >
      Day of the date
    data_tests:
    - not_null
  - name: day_of_week
    description: >
      Day of the week of the date, can be one of the following, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday and Sunday.
    data_tests:
    - not_null
- name: dim_geolocation
  description: |
    Dimension table containing olist ecommerce geoespacial information
    Note: to avoid duplicated rows on possible joins lat and lng are averaged
    based on zip code
  columns:
  - name: geo_zip_code_prefix
    description: >
      Zip code prefix of the geolocation information
    data_tests:
    - not_null
    - unique
  - name: geolocation_lat
    description: >
      Average latitude of the geolocation information based on zip code
    data_tests:
    - not_null
  - name: geolocation_lng
    description: >
      Average longitude of the geolocation information based on zip code
    data_tests:
    - not_null
  - name: geolocation_city
    description: >
      Most common city of the geolocation information based on zip code
    data_tests:
    - not_null
  - name: geolocation_state
    description: >
      Most common state of the geolocation information based on zip code
    data_tests:
    - not_null
- name: dim_orders
  description: |
    Bridge dimension containing order information from olist dataset.
  columns:
  - name: order_id
    description: >
      Primary key, identifier generated by olist system for each order.
    data_tests:
    - unique
    - not_null
  - name: customer_key
    description: >
      Foreign key to dim_customers table.
    data_tests:
    - unique
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customers')
          field: customer_key
  - name: order_status
    description: >
      Status of the order, can be one of the following, delivered, shipped, canceled, unavailable, invoiced, processing, created and approved.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: [ 'delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved' ]
  - name: purchase_date_key
    description: >
      Foreign key to dim_date table, date when the order was purchased.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
  - name: approved_date_key
    description: >
      Foreign key to dim_date table, date when the order was approved.
    data_tests:
    - not_null:
        config:
          where: "order_status not in ('created', 'canceled')"
          error_if: ">20"
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
  - name: delivered_carrier_date_key
    description: >
      Foreign key to dim_date table, date when it was handled to the logistic partner.
    data_tests:
    - not_null:
        config:
          where: "order_status in ('delivered', 'shipped')"
          error_if: ">20"
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
  - name: delivered_customer_date_key
    description: |
      Foreign key to dim_date table, date when the order was delivered to the customer.
      Note: 8 delivered orders lack a delivered_customer_date_key,
      these orders were delivered but the date was not recorded in the olist dataset.
    data_tests:
    - not_null:
        config:
          where: "order_status = 'delivered'"
          error_if: ">10"
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
  - name: estimated_delivery_date_key
    description: >
      Foreign key to dim_date table, estimated date when the order was delivered to the customer.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
  - name: is_delayed
    description: >
      Boolean value indicating if the order was delivered after the estimated delivery date.
    data_tests:
    - not_null:
        config:
          where: "order_status = 'delivered'"
          warn_if: ">0"
          error_if: ">3000"
    - accepted_values:
        arguments:
          values: [ 'true', 'false' ]
  - name: actual_delivery_days
    description: >
      Total time taken for the order to be delivered to the customer.
    data_tests:
    - not_null:
        config:
          error_if: ">10"
          where: "order_status = 'delivered'"
- name: dim_products
  description: |
    dimension table containing product information from olist dataset.
  columns:
  - name: product_key
    description: >
      Primary key, surrogate key using dbt_utils based on product_id.
    data_tests:
    - unique
    - not_null
  - name: product_id
    description: >
      Identifier generated by olist system for each product.
    data_tests:
    - unique
    - not_null
  - name: product_category_name_english
    description: >
      Product category name in english, translated from portuguese using stg_product_category_name_translation model.
  - name: product_weight_g
    description: |
      Weight of the product in grams.
      Note: 0 values are filtered out
      as they misrepresent unknown data, use nullif to filter out 0 values.
    data_tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          inclusive: false
    - not_null:
        config:
          severity: warn
  - name: product_length_cm
    description: >
      Length of the product in centimeters.
    data_tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          inclusive: false
    - not_null:
        config:
          severity: warn
  - name: product_height_cm
    description: >
      Height of the product in centimeters.
    data_tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          inclusive: false
    - not_null:
        config:
          severity: warn
  - name: product_photos_qty
    description: >
      Number of photos available for the product.
    data_tests:
    - not_null:
        config:
          error_if: ">630"
          warn_if: ">0"
- name: dim_sellers
  description: |
    dimension table containing seller information from olist dataset.
  columns:
  - name: seller_key
    description: >
      Primary key, surrogate key using dbt_utils based on seller_id.
    data_tests:
    - unique
    - not_null
  - name: seller_id
    description: >
      Identifier generated by olist system for each seller.
  - name: seller_zip_code_prefix
    description: >
      Zip code prefix of the seller address.
  - name: seller_city
    description: >
      City of the seller address.
  - name: seller_state
    description: >
      State of the seller address.
- name: fact_order_items
  description: |
    fact table containing order items information from olist dataset.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - order_item_id
        - order_id
  columns:
  - name: order_item_id
    description: >
      Sequential number identifying number of items included in the same order.
    data_tests:
    - not_null
  - name: order_id
    description: >
      Foreign key to dim_orders table.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_orders')
          field: order_id
  - name: product_key
    description: >
      Foreign key to dim_products table.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_products')
          field: product_key
  - name: seller_key
    description: >
      Foreign key to dim_sellers table.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_sellers')
          field: seller_key
  - name: shipping_limit_date_key
    description: >
      Foreign key to dim_date table, shows the seller shipping limit date for handling the order over to the logistic partner.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
  - name: price
    description: >
      Fact item price.
    data_tests:
    - not_null
  - name: freight_value
    description: >
      Freight value item (if an order has more than one item the freight value is splitted between items).
    data_tests:
    - not_null
- name: fact_payments
  description: |
    fact table containing payment information from olist dataset.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - order_id
        - payment_sequential
  columns:
  - name: order_id
    description: >
      Foreign key to dim_orders table.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_orders')
          field: order_id
  - name: payment_sequential
    description: >
      Sequential number identifying number of payments included in the same order.
    data_tests:
    - not_null
  - name: payment_type
    description: >
      Payment type used for the order, can be one of the following, credit_card, boleto, voucher, debit_card and not_defined.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: [ 'credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined' ]
  - name: payment_installments
    description: >
      Number of installments used to pay the order.
    data_tests:
    - not_null
  - name: payment_value
    description: |
      Payment value for the order. Its min value is 0,
      as some orders are paid using vouchers or other payment methods
      that don't require a monetary value. 
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          inclusive: true
- name: fact_reviews
  description: |
    fact table containing review information from olist dataset.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - review_id
        - order_id
  columns:
  - name: review_id
    description: >
      Primary key, identifier generated by olist system for each review.
    data_tests:
    - not_null
  - name: order_id
    description: >
      Foreign key to dim_orders table.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_orders')
          field: order_id
  - name: review_score
    description: >
      Review score given by the customer for the order, note range goes from 1 to 5.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: [ 1, 2, 3, 4, 5 ]
  - name: review_comment_title
    description: >
      Review comment title given by the customer for the order.
  - name: review_comment_message
    description: >
      Review comment message given by the customer for the order.
  - name: review_creation_date_key
    description: >
      Foreign key to dim_date table, date when the review was created.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
  - name: review_answer_date_key
    description: >
      Foreign key to dim_date table, date when the review was answered by olist team.
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
